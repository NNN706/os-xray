name: Subscription on OPNsense
on:
  push:
    branches: [fix/bounded-xray-logs]
permissions:
  contents: read
concurrency:
  group: opnsense-isolated-lab
  cancel-in-progress: false
jobs:
  subscription:
    name: Fetch and validate subscription on OPNsense
    runs-on: [self-hosted, linux, x64, os-xray-build]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate candidate against the isolated VM
        env:
          LAB_SSH_TARGET: ${{ secrets.OS_XRAY_LAB_SSH_TARGET }}
          LAB_SUBSCRIPTION_FIXTURE: ${{ secrets.OS_XRAY_LAB_SUBSCRIPTION_FIXTURE }}
        run: bash tests/system/run-subscription.sh
